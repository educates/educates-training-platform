name: Build and Publish Images

on:
  workflow_dispatch:
    inputs:
      target_platforms:
        type: choice
        description: Platforms
        options:
        - linux/amd64
        - linux/arm64
        - linux/amd64,linux/arm64
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

jobs:
  publish-generic-images:
    name: Publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: docker-registry
          - image: pause-container
          - image: session-manager
          - image: training-portal
          - image: secrets-manager
          - image: tunnel-manager
          - image: image-cache
          - image: assets-server
          - image: lookup-service
          - image: node-ca-injector
          # The v4 operator lives outside the <image-name>/ convention,
          # so it carries an explicit build context.
          - image: operator
            context: installer/operator

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Calculate platforms
        shell: bash
        run: |
          TARGET_PLATFORMS="${{github.event.inputs.target_platforms}}"
          if [ -z "$TARGET_PLATFORMS" ]; then
            TARGET_PLATFORMS="${{secrets.TARGET_PLATFORMS}}"
          fi
          # Only build for amd64 if it's a fork for speed reasons
          if [ -z "$TARGET_PLATFORMS" ]; then
            IS_FORK=$(if [[ $GITHUB_EVENT_NAME == 'push' && $GITHUB_EVENT_PATH ]]; then jq -r .repository.fork <<< $(cat $GITHUB_EVENT_PATH); else echo false; fi)
            if [ $IS_FORK == "true" ]; then
              TARGET_PLATFORMS="linux/amd64"
            else
              TARGET_PLATFORMS="linux/amd64,linux/arm64"
            fi
          fi
          echo "TARGET_PLATFORMS=${TARGET_PLATFORMS}" >>${GITHUB_ENV}

      - name: Calculate variables
        shell: bash
        run: |
          REPOSITORY_OWNER=${{github.repository_owner}}
          echo "REPOSITORY_OWNER=${REPOSITORY_OWNER,,}" >>${GITHUB_ENV}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Free Disk Space
        if: ${{ (matrix.image == 'secrets-manager') || (matrix.image == 'session-manager') || (matrix.image == 'training-portal') || (matrix.image == 'tunnel-manager') || (matrix.image == 'lookup-service') }}
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true

      - name: Restore Docker cache
        if: ${{ (matrix.image == 'secrets-manager') || (matrix.image == 'session-manager') || (matrix.image == 'training-portal') || (matrix.image == 'tunnel-manager') || (matrix.image == 'lookup-service') }}
        uses: actions/cache/restore@v5
        with:
          path: /tmp/.buildx-cache-amd64-new
          key: ${{runner.os}}-buildx-cache-${{matrix.image}}-${{github.sha}}
          restore-keys: |
            ${{runner.os}}-buildx-cache-${{matrix.image}}-

      - name: Rename cache directories
        run: |
          test -d /tmp/.buildx-cache-new && mv /tmp/.buildx-cache-new /tmp/.buildx-cache-old || true
          du -ks /tmp/.buildx-cache-* || true

      - name: Generate container image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{env.REPOSITORY_OWNER}}/educates-${{matrix.image}}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Login to GitHub container registry
        uses: docker/login-action@v4
        with:
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}
          registry: ghcr.io

      # The runtime subchart tarballs the operator embeds are build output,
      # packaged from their sources rather than committed, so they are
      # produced here before the image is built.
      - name: Package runtime subcharts into operator chart embeds
        if: matrix.image == 'operator'
        run: make -C installer/operator package-local-charts

      # On release tags the operator image must embed the runtime
      # subchart tarballs at the released version (versions are stamped
      # in CI, not committed — see decisions.md).
      - name: Stamp release version into operator chart embeds
        if: matrix.image == 'operator' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: ./hack/stamp-release-version.sh "${GITHUB_REF##*/}" ghcr.io "${{env.REPOSITORY_OWNER}}"

      - name: Build and push ${{matrix.image}} image
        uses: docker/build-push-action@v7
        with:
          context: ${{matrix.context || matrix.image}}
          platforms: ${{env.TARGET_PLATFORMS}}
          tags: ${{steps.meta.outputs.tags}}
          cache-from: type=local,src=/tmp/.buildx-cache-old
          cache-to: type=local,mode=max,dest=/tmp/.buildx-cache-new
          push: true

      - name: Remove old cache directories
        run: |
          rm -rf /tmp/.buildx-cache-old || true

      - name: Dump cache directory sizes
        if: ${{ (matrix.image == 'secrets-manager') || (matrix.image == 'session-manager') || (matrix.image == 'training-portal') || (matrix.image == 'tunnel-manager') || (matrix.image == 'lookup-service') }}
        run: |
          du -ks /tmp/.buildx-cache-* || true

      - name: Save Docker cache
        if: ${{ (matrix.image == 'secrets-manager') || (matrix.image == 'session-manager') || (matrix.image == 'training-portal') || (matrix.image == 'tunnel-manager') || (matrix.image == 'lookup-service') }}
        uses: actions/cache/save@v5
        with:
          path: /tmp/.buildx-cache-new
          key: ${{runner.os}}-buildx-cache-${{matrix.image}}-${{github.sha}}

