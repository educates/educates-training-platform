            type=sha

      - name: Login to GitHub container registry
        uses: docker/login-action@v4
        with:
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}
          registry: ghcr.io

      - name: Build and push docker-cli image
        uses: docker/build-push-action@v7
        with:
          context: client-programs
          platforms: ${{env.TARGET_PLATFORMS}}
          build-args: |
            REPOSITORY=ghcr.io/${{env.REPOSITORY_OWNER}}
            TAG=${{env.REPOSITORY_SHA_TAG}}
            PROJECT_VERSION=${{env.REPOSITORY_TAG}}
            IMAGE_REPOSITORY=ghcr.io/${{env.REPOSITORY_OWNER}}
            GIT_COMMIT=${{env.GIT_COMMIT}}
            GIT_COMMIT_DATE=${{env.GIT_COMMIT_DATE}}
          tags: ${{steps.meta.outputs.tags}}
          push: true

  publish-docker-extension:
    name: Extension
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    needs:
      - publish-cli-image

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Calculate variables
        shell: bash
        run: |
          REPOSITORY_OWNER=${{github.repository_owner}}
          echo "REPOSITORY_OWNER=${REPOSITORY_OWNER,,}" >>${GITHUB_ENV}
          echo "REPOSITORY_SHA_TAG=sha-${GITHUB_SHA::7}" >>${GITHUB_ENV}

      - name: Calculate platforms
        shell: bash
        run: |
          TARGET_PLATFORMS="${{github.event.inputs.target_platforms}}"
          if [ -z "$TARGET_PLATFORMS" ]; then
            TARGET_PLATFORMS="${{secrets.TARGET_PLATFORMS}}"
          fi
          # Only build for amd64 if it's a fork for speed reasons
          if [ -z "$TARGET_PLATFORMS" ]; then
            IS_FORK=$(if [[ $GITHUB_EVENT_NAME == 'push' && $GITHUB_EVENT_PATH ]]; then jq -r .repository.fork <<< $(cat $GITHUB_EVENT_PATH); else echo false; fi)
            if [ $IS_FORK == "true" ]; then
              TARGET_PLATFORMS="linux/amd64"
            else
              TARGET_PLATFORMS="linux/amd64,linux/arm64"
            fi
          fi
          echo "TARGET_PLATFORMS=${TARGET_PLATFORMS}" >>${GITHUB_ENV}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate container image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{env.REPOSITORY_OWNER}}/educates-docker-extension
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Login to GitHub container registry
        uses: docker/login-action@v4
        with:
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}
          registry: ghcr.io

      - name: Build and push docker-extension image
        uses: docker/build-push-action@v7
        with:
          context: docker-extension
          platforms: ${{env.TARGET_PLATFORMS}}
          build-args: |
            REPOSITORY=ghcr.io/${{env.REPOSITORY_OWNER}}
            TAG=${{env.REPOSITORY_SHA_TAG}}
          tags: ${{steps.meta.outputs.tags}}
          push: true

  publish-charts:
    name: Publish (helm charts)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: read
      packages: write

    # Charts reference the images this run publishes; don't push charts
    # for a release whose images failed.
    needs:
      - publish-generic-images

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Calculate variables
        shell: bash
        run: |
          REPOSITORY_OWNER=${{github.repository_owner}}
          echo "REPOSITORY_OWNER=${REPOSITORY_OWNER,,}" >>${GITHUB_ENV}
          echo "REPOSITORY_TAG=${GITHUB_REF##*/}" >>${GITHUB_ENV}

      - name: Stamp release version
        shell: bash
        run: ./hack/stamp-release-version.sh "${{env.REPOSITORY_TAG}}" ghcr.io "${{env.REPOSITORY_OWNER}}"

      - name: Package charts
        shell: bash
        run: |
          mkdir -p dist
          helm package installer/charts/educates-installer --destination dist
          helm package installer/charts/educates-training-platform --destination dist

      - name: Login to GitHub container registry
        shell: bash
        run: |
          echo "${{secrets.GITHUB_TOKEN}}" | helm registry login ghcr.io \
            --username ${{github.actor}} --password-stdin

      - name: Push charts to OCI registry
        shell: bash
        run: |
          helm push dist/educates-installer-${{env.REPOSITORY_TAG}}.tgz \
            oci://ghcr.io/${{env.REPOSITORY_OWNER}}/charts
          helm push dist/educates-training-platform-${{env.REPOSITORY_TAG}}.tgz \
            oci://ghcr.io/${{env.REPOSITORY_OWNER}}/charts

      - uses: actions/upload-artifact@v7
        with:
          name: helm-charts
          path: dist/*.tgz

  publish-schemas:
    name: Publish (json schemas)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    # Deploys to this repository's GitHub Pages site (upstream maps it
    # to schemas.educates.dev — see developer-docs/json-schemas.md).
    # Forks without Pages enabled fail the deploy step; that must not
    # gate the release.
    continue-on-error: true

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      # Published filenames drop the .schema infix to match the $id
      # baked into each schema (…/cli/v1alpha1/<Kind>.json).
      - name: Stage schemas
        shell: bash
        run: |
          mkdir -p site/cli/v1alpha1
          for f in client-programs/pkg/config/v1alpha1/schemas/*.schema.json; do
            name=$(basename "$f" .schema.json)
            cp "$f" "site/cli/v1alpha1/$name.json"
          done
          {
            echo '<!DOCTYPE html><html><head><title>Educates CLI JSON schemas</title></head><body>'
            echo '<h1>Educates CLI JSON schemas (cli.educates.dev/v1alpha1)</h1><ul>'
            for f in site/cli/v1alpha1/*.json; do
              echo "<li><a href=\"cli/v1alpha1/$(basename "$f")\">$(basename "$f")</a></li>"
            done
            echo '</ul></body></html>'
          } > site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  publish-image-list:
    name: Publish (image list)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: read
      packages: read

    # Digest resolution needs every listed image already pushed. The
    # list now includes the JDK/conda workshop environments, so the
    # workshop-images job has to finish first too.
    needs:
      - publish-generic-images
      - publish-workshop-base-image
      - publish-workshop-images

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Calculate variables
        shell: bash
        run: |
          REPOSITORY_OWNER=${{github.repository_owner}}
          echo "REPOSITORY_OWNER=${REPOSITORY_OWNER,,}" >>${GITHUB_ENV}
          echo "REPOSITORY_TAG=${GITHUB_REF##*/}" >>${GITHUB_ENV}

      # Digest-pinned list of every image an air-gapped install can need
      # (platform images + the full session-manager image inventory:
      # base-environment, JDK/conda environments, and the vcluster
      # application images + upstream cluster-service images from the
      # vendored charts). Attached to the GitHub release for
      # name-preserving mirroring with skopeo/crane.
      - name: Generate image list
        shell: bash
        run: |
          skopeo login ghcr.io --username ${{github.actor}} --password ${{secrets.GITHUB_TOKEN}}
          ./hack/generate-image-list.sh "${{env.REPOSITORY_TAG}}" ghcr.io "${{env.REPOSITORY_OWNER}}" \
            > educates-images-${{env.REPOSITORY_TAG}}.txt
          cat educates-images-${{env.REPOSITORY_TAG}}.txt

      - uses: actions/upload-artifact@v7
        with:
          name: image-list
          path: educates-images-*.txt

  release-artifacts:
    name: Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-client-programs-linux-amd64
      - build-client-programs-linux-arm64
      - build-client-programs-darwin-amd64
      - build-client-programs-darwin-arm64
      - publish-cli-image
      - publish-docker-extension
      - publish-charts
      - publish-image-list

    steps:
      - name: Calculate variables
        shell: bash
        run: |
          REPOSITORY_TAG="${GITHUB_REF##*/}"
          if [[ "$REPOSITORY_TAG" == *-* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi
          echo "REPOSITORY_TAG=${REPOSITORY_TAG}" >>${GITHUB_ENV}
          echo "PRERELEASE=${PRERELEASE}" >>${GITHUB_ENV}

      - name: Restore educates-linux-amd64
        uses: actions/download-artifact@v8
        with:
          name: educates-linux-amd64

      - name: Restore educates-linux-arm64
        uses: actions/download-artifact@v8
        with:
          name: educates-linux-arm64

      - name: Restore educates-darwin-amd64
        uses: actions/download-artifact@v8
        with:
          name: educates-darwin-amd64

      - name: Restore educates-darwin-arm64
        uses: actions/download-artifact@v8
        with:
          name: educates-darwin-arm64

      - name: Restore helm charts
        uses: actions/download-artifact@v8
        with:
          name: helm-charts

      - name: Restore image list
        uses: actions/download-artifact@v8
        with:
          name: image-list

      - name: Generate file checksums for CLI binaries
        shell: bash
        run: |
          sha256sum educates-darwin-amd64 >> checksums.txt
          sha256sum educates-darwin-arm64 >> checksums.txt
          sha256sum educates-linux-amd64 >> checksums.txt
          sha256sum educates-linux-arm64 >> checksums.txt
          sha256sum educates-installer-${{env.REPOSITORY_TAG}}.tgz >> checksums.txt
          sha256sum educates-training-platform-${{env.REPOSITORY_TAG}}.tgz >> checksums.txt
          sha256sum educates-images-${{env.REPOSITORY_TAG}}.txt >> checksums.txt
          echo 'File Checksums' >> release-notes.md
          echo '--------------' >> release-notes.md
          echo '```' >> release-notes.md
          cat checksums.txt >> release-notes.md
          echo '```' >> release-notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: checksums.txt
          path: checksums.txt

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes.md
          path: release-notes.md

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
        with:
          tag_name: ${{env.REPOSITORY_TAG}}
          name: "educates:${{env.REPOSITORY_TAG}}"
          draft: false
          prerelease: ${{env.PRERELEASE}}
          body_path: release-notes.md
          files: |
            checksums.txt
            educates-linux-amd64
            educates-linux-arm64
            educates-darwin-amd64
            educates-darwin-arm64
            educates-installer-*.tgz
            educates-training-platform-*.tgz
            educates-images-*.txt
