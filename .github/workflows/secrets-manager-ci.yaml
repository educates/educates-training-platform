name: Secrets Manager CI

on:
  push:
    branches: [develop, main]
    paths:
      - 'secrets-manager/**'
      - 'installer/charts/educates-training-platform/charts/secrets-manager/crds/**'
      - 'go.work'
      - 'go.work.sum'
      - '.github/workflows/secrets-manager-ci.yaml'
  pull_request:
    paths:
      - 'secrets-manager/**'
      - 'installer/charts/educates-training-platform/charts/secrets-manager/crds/**'
      - 'go.work'
      - 'go.work.sum'
      - '.github/workflows/secrets-manager-ci.yaml'

jobs:
  ci:
    name: Build, vet, drift, envtest, lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: secrets-manager/go.mod
          cache-dependency-path: |
            go.work.sum
            secrets-manager/go.sum

      # Single source of truth: `make ci-secrets-manager` runs exactly the
      # checks this job gates: go vet and build, the DeepCopy drift check,
      # the tests, the scenario suite against envtest among them, and
      # golangci-lint. Edit the Makefile, not this list, so local `make ci`
      # and CI never drift apart. See developer-docs/build-instructions.md.
      - name: make ci-secrets-manager
        run: make ci-secrets-manager
