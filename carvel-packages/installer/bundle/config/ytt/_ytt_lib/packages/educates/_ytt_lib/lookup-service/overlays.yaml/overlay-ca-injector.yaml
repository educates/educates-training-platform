#@ load("@ytt:overlay", "overlay")
#@ load("@ytt:data", "data")

#@overlay/match by=overlay.subset({"kind":"Deployment"})
---
spec:
  template:
    spec:
      #@ if data.values.caName != None and data.values.caName != "":
      #@overlay/match missing_ok=True
      initContainers:
      - name: ca-trust-store-initialization
        image: #@ data.values.workshopBaseImage
        imagePullPolicy: #@ data.values.workshopBaseImagePullPolicy
        securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: false
            runAsUser: 0
        command:
        - /opt/eduk8s/sbin/setup-certificates
        volumeMounts:
        - name: workshop-ca
          mountPath: /etc/pki/ca-trust/source/anchors/Cluster_Ingress_CA.pem
          subPath: ca.crt
        - name: workshop-ca-trust
          mountPath: /mnt
      containers:
      #@overlay/match by="name"
      - name: lookup-service
        volumeMounts:
        #! The init container copies the whole of /etc/pki, not just
        #! /etc/pki/ca-trust, so mount it over the whole directory. OpenSSL's
        #! default CApath, /etc/pki/tls/certs, holds hashed symlinks that
        #! update-ca-trust regenerates alongside the trust store, and the
        #! system Python used by the lookup service only sees the ingress CA
        #! if those come from the same regenerated copy.
        - name: workshop-ca-trust
          mountPath: /etc/pki
          readOnly: true
      volumes:
      - name: workshop-ca
        secret:
          secretName: #@ data.values.caName
      - name: workshop-ca-trust
        emptyDir: {}
      #@ end
