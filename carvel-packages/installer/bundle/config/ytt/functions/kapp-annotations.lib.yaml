#@   end
#@   annotations = metadata["annotations"]
#@   if not annotations:
#@     return False
#@   end
#@   return "kapp.k14s.io/versioned" in annotations
#@ end

#@ def keepOriginalOnVersioned():
#@overlay/match by=isVersioned, expects="0+"
---
metadata:
  annotations:
    #@overlay/remove
    kapp.k14s.io/disable-original:
