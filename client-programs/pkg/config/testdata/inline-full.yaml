apiVersion: cli.educates.dev/v1alpha1
kind: EducatesInlineConfig

domain: workshops.example.com
ingressClassName: openshift-default
wildcardCertificateSecret: educates-wildcard-tls
caCertificateSecret: educates-wildcard-ca
clusterIssuerName: corp-ca-issuer

imageRegistry:
  prefix: registry.internal.example.com/educates
  pullSecrets:
    - internal-registry-pull

policyEnforcement:
  clusterEngine: PodSecurityStandards
  workshopEngine: None

externalTLSTermination: true

clusterAdmin: true
lookupService: false
imagePrePuller:
  enabled: false
  includeDefaultImages: false
  images:
    - name: jdk21-environment
    - image: ghcr.io/example/custom-environment:1.0

websiteStyling:
  defaultTheme: my-theme-data
  themeDataRefs:
    - namespace: educates
      name: my-theme-data

secretPropagation:
  imagePullSecretNames:
    - my-pull-secret

imageVersions:
  - name: base-environment
    image: ghcr.io/educates/base-environment:4.0.0

operator:
  image:
    repository: ghcr.io/educates/educates-operator
    tag: 4.0.0
    pullPolicy: IfNotPresent
  imagePullSecrets:
    - operator-pull-secret
  logLevel: debug
