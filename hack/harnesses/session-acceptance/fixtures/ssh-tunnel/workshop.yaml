apiVersion: training.educates.dev/v1beta1
kind: Workshop
metadata:
  name: ssh-tunnel
spec:
  title: SSH Remote Access Test
  description: SSH access to the session over the websocket tunnelling proxy.
  duration: 15m
  difficulty: intermediate
  publish:
    image: "$(image_repository)/session-acceptance-ssh-tunnel-files:$(workshop_version)"
  workshop:
    files:
    - image:
        url: "$(image_repository)/session-acceptance-ssh-tunnel-files:$(workshop_version)"
      includePaths:
      - /exercises/**
      - /workshop/**
      - /README.md
  session:
    namespaces:
      security:
        token:
          enabled: true
    applications:
      terminal:
        enabled: true
        layout: split
      editor:
        enabled: true
      sshd:
        enabled: true
        tunnel:
          enabled: true
