# shellcheck shell=bash
# The secrets-manager kit, sourced by kit.sh. See README.md beside it.

KIT_DESCRIPTION="The Go secrets-manager's four kinds in sync, in each failing state, and recovered"

# The kinds status shows, events reports on, and delete removes by the
# kit's label. The cluster-scoped kinds come first, so that kubectl prints
# no empty NAMESPACE column for them.
KIT_KINDS="
  secretcopiers.secrets.educates.dev
  secretinjectors.secrets.educates.dev
  secretexporters.secrets.educates.dev
  secretimporters.secrets.educates.dev
"

# The In Sync printer column of copiers, exporters and injectors.
KIT_PATH_insync='{.status.summary.inSyncRatio}'
