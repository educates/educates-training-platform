# A copy the API server rejects: targetSecret.keys leaves tls.crt and
# tls.key out of a kubernetes.io/tls source.
apiVersion: v1
kind: Secret
metadata:
  name: tls
  namespace: kit-secrets-manager-source
type: kubernetes.io/tls
stringData:
  tls.crt: not-a-real-certificate
  tls.key: not-a-real-key
  ca.crt: not-a-real-ca
---
apiVersion: secrets.educates.dev/v1beta1
kind: SecretCopier
metadata:
  name: kit-secrets-manager-target-errors
spec:
  rules:
  - sourceSecret:
      name: tls
      namespace: kit-secrets-manager-source
    targetNamespaces:
      nameSelector:
        matchNames:
        - kit-secrets-manager-target-a
    targetSecret:
      keys:
      - ca.crt
