# Refused at admission: sourceSecret.keys must list at least one key.
apiVersion: secrets.educates.dev/v1beta1
kind: SecretCopier
metadata:
  name: kit-secrets-manager-rejected-keys-empty
spec:
  rules:
  - sourceSecret:
      name: healthy
      namespace: kit-secrets-manager-source
      keys: []
    targetNamespaces:
      nameSelector:
        matchNames:
        - kit-secrets-manager-target-a
