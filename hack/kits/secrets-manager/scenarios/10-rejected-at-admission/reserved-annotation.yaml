# Refused at admission: annotation keys under secrets.educates.dev/ are
# reserved for the secrets-manager's tracking annotations.
apiVersion: secrets.educates.dev/v1beta1
kind: SecretCopier
metadata:
  name: kit-secrets-manager-rejected-annotation
spec:
  rules:
  - sourceSecret:
      name: healthy
      namespace: kit-secrets-manager-source
    targetNamespaces:
      nameSelector:
        matchNames:
        - kit-secrets-manager-target-a
    targetSecret:
      annotations:
        secrets.educates.dev/copier-rule: secretcopier/somebody-else
