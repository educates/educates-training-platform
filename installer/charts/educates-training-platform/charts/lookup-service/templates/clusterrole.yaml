apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: educates:lookup-service
  labels:
    {{- include "lookup-service.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create]
  - apiGroups: [lookup.educates.dev]
    resources: [clusterconfigs, clientconfigs, tenantconfigs]
    verbs: [get, list, watch, patch, update]
  - apiGroups: [lookup.educates.dev]
    resources: [clusterconfigs/finalizers, clientconfigs/finalizers, tenantconfigs/finalizers]
    verbs: [update]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: educates:lookup-service
  labels:
    {{- include "lookup-service.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: educates:lookup-service
subjects:
  - kind: ServiceAccount
    name: lookup-service
    namespace: {{ .Release.Namespace }}
