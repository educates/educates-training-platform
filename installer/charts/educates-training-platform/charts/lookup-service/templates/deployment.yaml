{{- $ci := include "lookup-service.resolvedClusterIngress" . | fromYaml -}}
{{- $caRef := default dict $ci.caCertificateRef -}}
{{- $caEnabled := and $caRef.name true -}}
{{- $caMountPath := "/opt/app-root/certs/ingress-ca" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lookup-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lookup-service.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "lookup-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lookup-service.labels" . | nindent 8 }}
        {{- include "lookup-service.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: lookup-service
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        # The image's entrypoint is the service's binary, so the chart gives
        # only its flags.
        - name: lookup-service
          image: "{{ include "lookup-service.image.repository" . }}:{{ include "lookup-service.image.tag" . }}"
          imagePullPolicy: {{ include "lookup-service.image.pullPolicy" . }}
          args:
            - --log-level={{ .Values.logLevel }}
            {{- if $caEnabled }}
            - --ingress-ca-file={{ $caMountPath }}/ca.crt
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
            - containerPort: 8081
          # The service answers /healthz while its process serves requests.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
          # /readyz answers once the service has loaded its configuration
          # from the config namespace. It never waits for the clusters the
          # configuration names, so an unreachable cluster cannot keep the
          # service out of rotation.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 2
            periodSeconds: 5
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.remoteAccessTokenMount.enabled $caEnabled }}
          volumeMounts:
            {{- if .Values.remoteAccessTokenMount.enabled }}
            - name: cluster-access-token
              mountPath: /opt/cluster-access-token
            {{- end }}
            {{- if $caEnabled }}
            # The service trusts ca.crt from this mount, besides the system
            # roots, when it calls training portals, which lets it verify
            # portals whose certificates chain to the cluster's private or
            # self-signed CA. Only ca.crt is projected from the Secret.
            # Mounted as a directory, not via subPath, so a rotated Secret
            # propagates into the pod; the service reads it when it starts.
            - name: cluster-ca
              mountPath: {{ $caMountPath }}
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or .Values.remoteAccessTokenMount.enabled $caEnabled }}
      volumes:
        {{- if .Values.remoteAccessTokenMount.enabled }}
        # The Secret exists only while remote access is installed on this
        # cluster. Without it the pod still starts, with the mount empty,
        # and a ClusterConfig for the local cluster is not connected until
        # the Secret appears and kubelet fills the mount.
        - name: cluster-access-token
          secret:
            secretName: remote-access-token
            optional: true
        {{- end }}
        {{- if $caEnabled }}
        - name: cluster-ca
          secret:
            secretName: {{ $caRef.name | quote }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
      {{- end }}
