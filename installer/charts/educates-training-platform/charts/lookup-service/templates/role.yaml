{{- /*
lookup-service's own access, confined to its configuration namespace: it
indexes the Secrets there, serves and patches its configuration resources,
and posts events about them. It needs nothing cluster-wide. The operators it
runs for each monitored cluster use that cluster's kubeconfig, and the local
cluster's is the remote-access account's token.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: educates-lookup-service
  namespace: {{ include "lookup-service.configNamespace" . }}
  labels:
    {{- include "lookup-service.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [list, watch]
  - apiGroups: [lookup.educates.dev]
    resources: [clusterconfigs, clientconfigs, tenantconfigs]
    verbs: [list, watch, patch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: educates-lookup-service
  namespace: {{ include "lookup-service.configNamespace" . }}
  labels:
    {{- include "lookup-service.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: educates-lookup-service
subjects:
  - kind: ServiceAccount
    name: lookup-service
    namespace: {{ .Release.Namespace }}
