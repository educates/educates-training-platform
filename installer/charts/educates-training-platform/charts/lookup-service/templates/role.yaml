{{- /*
lookup-service's own access, confined to its configuration namespace: it
watches its configuration resources there and the Secrets holding the
kubeconfigs of remote clusters, and writes nothing there. It needs nothing
cluster-wide. It reaches each monitored cluster with that cluster's
kubeconfig, and the local cluster with the remote-access account's token.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: educates-lookup-service
  namespace: {{ include "lookup-service.configNamespace" . }}
  labels:
    {{- include "lookup-service.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [list, watch]
  - apiGroups: [lookup.educates.dev]
    resources: [clusterconfigs, clientconfigs, tenantconfigs]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: educates-lookup-service
  namespace: {{ include "lookup-service.configNamespace" . }}
  labels:
    {{- include "lookup-service.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: educates-lookup-service
subjects:
  - kind: ServiceAccount
    name: lookup-service
    namespace: {{ .Release.Namespace }}
