# Values for the lookup-service subchart.

# Local-development override. Leave empty in normal use — image refs
# resolve from Chart.yaml annotations (`educates.dev/image-registry-host`
# / `-namespace`) which the chart's publish workflow updates per fork.
# Override at the umbrella level under `global.development.imageRegistry`
# to redirect every Educates-image reference (across all subcharts) in
# one knob.
development:
  imageRegistry:
    host: ""
    namespace: ""

image:
  # Empty `repository` derives `{imageRegistry.host}/{imageRegistry.namespace}/educates-lookup-service`.
  # Empty `tag` falls through to `Chart.AppVersion`.
  repository: ""
  tag: ""
  pullPolicy: ""

# Image pull secret references in the operator namespace.
imagePullSecrets: []

resources: {}

# Cluster-wide ingress identity. Same shape as the umbrella's
# `global.clusterIngress`; under the umbrella, set values there and they
# propagate here automatically. This subchart consumes:
#
#   - `tlsCertificateRef` — TLS Secret backing this Ingress. Typically the
#     wildcard cert covering `*.<domain>` (which includes the lookup-service
#     hostname). Empty disables TLS on the Ingress.
#   - `caCertificateRef` — CA Secret. When set, the chart mounts its
#     `ca.crt` key, and only that key, at
#     `/opt/app-root/certs/ingress-ca` and the image's start script appends
#     the CA to the bundle its TLS environment variables point at. Required
#     when the lookup-service must verify TLS against a private/self-signed
#     CA when calling other clusters' training portals.
#
# When either ref's `namespace` differs from the release namespace, the
# chart auto-creates a SecretCopier so the runtime finds the Secret locally.
clusterIngress:
  tlsCertificateRef:
    name: ""
    namespace: ""
  caCertificateRef:
    name: ""
    namespace: ""

ingress:
  # Fully-qualified hostname for the lookup-service ingress (e.g.
  # `lookup.workshops.example.com`). The v4 operator computes this from
  # the LookupService CR's prefix and EducatesClusterConfig.status.domain.
  host: ""
  # IngressClass name. Empty leaves the cluster default.
  className: ""

# When true, the Deployment mounts the `remote-access-token` Secret, the
# token of the `remote-access` service account, at /opt/cluster-access-token.
# The lookup-service runtime uses it only for a ClusterConfig of the local
# cluster (one without a kubeconfig secretRef). The mount is optional: the
# Secret exists only while remote access is installed on this cluster (the
# umbrella's `remote-access.enabled`, or the SessionManager's
# `spec.remoteAccess.mode`), and without it the pod still starts, but the
# local cluster is not connected and contributes no training portals.
remoteAccessTokenMount:
  enabled: true
