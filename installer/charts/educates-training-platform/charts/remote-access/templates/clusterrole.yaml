apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: educates:remote-access
  labels:
    {{- include "remote-access.labels" . | nindent 4 }}
rules:
  - apiGroups: [training.educates.dev]
    resources:
      - trainingportals
      - workshopenvironments
      - workshopsessions
      - workshopallocations
      - workshops
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: educates:remote-access
  labels:
    {{- include "remote-access.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: educates:remote-access
subjects:
  - kind: ServiceAccount
    name: remote-access
    namespace: {{ .Release.Namespace }}
