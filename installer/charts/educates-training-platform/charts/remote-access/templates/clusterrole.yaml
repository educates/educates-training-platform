# What lookup-service watches on a cluster it manages. It also reads each
# training portal's robot credentials Secret, through the Role and
# RoleBinding `educates-remote-access` session-manager creates in every
# portal namespace, which grant `get` on that one Secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: educates:remote-access
  labels:
    {{- include "remote-access.labels" . | nindent 4 }}
rules:
  - apiGroups: [training.educates.dev]
    resources:
      - trainingportals
      - workshopenvironments
      - workshopsessions
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: educates:remote-access
  labels:
    {{- include "remote-access.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: educates:remote-access
subjects:
  - kind: ServiceAccount
    name: remote-access
    namespace: {{ .Release.Namespace }}
