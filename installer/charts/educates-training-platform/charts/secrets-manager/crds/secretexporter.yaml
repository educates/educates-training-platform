apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: secretexporters.secrets.educates.dev
spec:
  scope: Namespaced
  group: secrets.educates.dev
  names:
    plural: secretexporters
    singular: secretexporter
    kind: SecretExporter
    categories:
    - educates-secrets
  versions:
    - name: v1beta1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
          - spec
          properties:
            spec:
              type: object
              properties:
                rules:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required:
                    - targetNamespaces
                    properties:
                      targetNamespaces:
                        type: object
                        properties:
                          nameSelector:
                            type: object
                            required:
                            - matchNames
                            properties:
                              matchNames:
                                type: array
                                items:
                                  type: string
                          uidSelector:
                            type: object
                            required:
                            - matchUIDs
                            properties:
                              matchUIDs:
                                type: array
                                items:
                                  type: string
                          ownerSelector:
                            type: object
                            required:
                            - matchOwners
                            properties:
                              matchOwners:
                                type: array
                                items:
                                  type: object
                                  required:
                                  - apiVersion
                                  - kind
                                  - name
                                  - uid
                                  properties:
                                    apiVersion:
                                      type: string
                                    kind:
                                      type: string
                                    name:
                                      type: string
                                    uid:
                                      type: string
                          labelSelector:
                            type: object
                            properties:
                              matchLabels:
                                type: object
                                x-kubernetes-preserve-unknown-fields: true
                                additionalProperties:
                                  type: string
                              matchExpressions:
                                type: array
                                items:
                                  type: object
                                  required:
                                  - key
                                  - operator
                                  properties:
                                    key:
                                      type: string
                                    operator:
                                      type: string
                                      enum:
                                      - In
                                      - NotIn
                                      - Exists
                                      - DoesNotExist
                                    values:
                                      type: array
                                      items:
                                        type: string
                        anyOf:
                        - required:
                          - nameSelector
                        - required:
                          - uidSelector
                        - required:
                          - ownerSelector
                        - required:
                          - labelSelector
                      targetSecret:
                        type: object
                        properties:
                          name:
                            type: string
                          labels:
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
                            additionalProperties:
                              type: string
                          annotations:
                            type: object
                            maxProperties: 32
                            additionalProperties:
                              type: string
                            x-kubernetes-validations:
                            - rule: self.all(k, !k.startsWith('secrets.educates.dev/'))
                              message: annotation keys under secrets.educates.dev/ are reserved for the secrets-manager
                          keys:
                            type: array
                            items:
                              type: string
                      copyAuthorization:
                        type: object
                        required:
                        - sharedSecret
                        properties:
                          sharedSecret:
                            type: string
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                  - type
                  items:
                    type: object
                    required:
                    - type
                    - status
                    - lastTransitionTime
                    - reason
                    - message
                    properties:
                      type:
                        type: string
                        maxLength: 316
                      status:
                        type: string
                        enum:
                        - "True"
                        - "False"
                        - Unknown
                      observedGeneration:
                        type: integer
                        format: int64
                        minimum: 0
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                        minLength: 1
                        maxLength: 1024
                      message:
                        type: string
                        maxLength: 32768
                sourceExists:
                  type: boolean
                summary:
                  type: object
                  required:
                  - targetNamespaces
                  - inSync
                  - conflicts
                  - awaitingAuthorization
                  - failures
                  - inSyncRatio
                  properties:
                    targetNamespaces:
                      type: integer
                      format: int32
                    inSync:
                      type: integer
                      format: int32
                    conflicts:
                      type: integer
                      format: int32
                    awaitingAuthorization:
                      type: integer
                      format: int32
                    failures:
                      type: integer
                      format: int32
                    inSyncRatio:
                      type: string
                rules:
                  type: array
                  items:
                    type: object
                    required:
                    - targetNamespaces
                    - inSync
                    - conflicts
                    - awaitingAuthorization
                    - failures
                    properties:
                      targetNamespaces:
                        type: integer
                        format: int32
                      inSync:
                        type: integer
                        format: int32
                      conflicts:
                        type: integer
                        format: int32
                      awaitingAuthorization:
                        type: integer
                        format: int32
                      failures:
                        type: integer
                        format: int32
      subresources:
        status: {}
      additionalPrinterColumns:
      - name: Ready
        type: string
        jsonPath: '.status.conditions[?(@.type=="Ready")].status'
      - name: Reason
        type: string
        jsonPath: '.status.conditions[?(@.type=="Ready")].reason'
      - name: In Sync
        type: string
        jsonPath: .status.summary.inSyncRatio
      - name: Age
        type: date
        jsonPath: .metadata.creationTimestamp
