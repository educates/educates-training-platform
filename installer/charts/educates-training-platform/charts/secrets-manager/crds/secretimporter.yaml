apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: secretimporters.secrets.educates.dev
spec:
  scope: Namespaced
  group: secrets.educates.dev
  names:
    plural: secretimporters
    singular: secretimporter
    kind: SecretImporter
    categories:
    - educates-secrets
  versions:
    - name: v1beta1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
          - spec
          properties:
            spec:
              type: object
              properties:
                sourceNamespaces:
                  type: object
                  properties:
                    nameSelector:
                      type: object
                      required:
                      - matchNames
                      properties:
                        matchNames:
                          type: array
                          items:
                            type: string
                copyAuthorization:
                  type: object
                  required:
                  - sharedSecret
                  properties:
                    sharedSecret:
                      type: string
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                  - type
                  items:
                    type: object
                    required:
                    - type
                    - status
                    - lastTransitionTime
                    - reason
                    - message
                    properties:
                      type:
                        type: string
                        maxLength: 316
                      status:
                        type: string
                        enum:
                        - "True"
                        - "False"
                        - Unknown
                      observedGeneration:
                        type: integer
                        format: int64
                        minimum: 0
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                        minLength: 1
                        maxLength: 1024
                      message:
                        type: string
                        maxLength: 32768
                boundTo:
                  type: object
                  required:
                  - kind
                  - name
                  properties:
                    kind:
                      type: string
                    namespace:
                      type: string
                    name:
                      type: string
                targetSecretName:
                  type: string
      subresources:
        status: {}
      additionalPrinterColumns:
      - name: Ready
        type: string
        jsonPath: '.status.conditions[?(@.type=="Ready")].status'
      - name: Reason
        type: string
        jsonPath: '.status.conditions[?(@.type=="Ready")].reason'
      - name: Age
        type: date
        jsonPath: .metadata.creationTimestamp
