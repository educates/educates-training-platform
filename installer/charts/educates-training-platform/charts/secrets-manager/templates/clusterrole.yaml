{{- /*
The secrets-manager's own access, cluster wide. It reads Secrets everywhere
and writes the copies it makes, deleting a copy only to recreate it when its
source's type changed; it adds names to service accounts; it reads the four
secrets.educates.dev kinds and writes only their status; it sets
blockOwnerDeletion on copies owned by a SecretCopier or a SecretImporter,
which needs update on their finalizers; and it records Events through
events.k8s.io, those of SecretCopiers and SecretInjectors, which have no
namespace, in the default namespace.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: educates:secrets-manager
  labels:
    {{- include "secrets-manager.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [secrets.educates.dev]
    resources: [secretcopiers, secretexporters, secretimporters, secretinjectors]
    verbs: [get, list, watch]
  - apiGroups: [secrets.educates.dev]
    resources: [secretcopiers/status, secretexporters/status, secretimporters/status, secretinjectors/status]
    verbs: [update, patch]
  - apiGroups: [secrets.educates.dev]
    resources: [secretcopiers/finalizers, secretimporters/finalizers]
    verbs: [update]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [create, patch]
