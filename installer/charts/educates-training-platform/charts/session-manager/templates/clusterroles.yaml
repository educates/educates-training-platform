{{- /*
ClusterRoles consumed by the session-manager and the runtime it spawns
(training portal pods, workshop session pods, tunnel manager). Names
follow the `educates:` prefix convention for cluster-scoped RBAC
(`educates:<service>` for service roles, `educates:session:<level>` for
the roles bound to workshop session service accounts).
*/ -}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: educates:session-manager
  labels:
    {{- include "session-manager.labels" . | nindent 4 }}
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        rbac.educates.dev/extends-workshop-permissions: "true"
# `rules` is intentionally omitted: the clusterrole-aggregation-controller
# owns the .rules field on aggregate ClusterRoles, populating it by merging
# rules from labelled child roles. Declaring `rules: []` here would claim
# field ownership under server-side-apply (Helm v3+ uses SSA on upgrade),
# fighting the aggregation controller and producing a conflict error every
# reconcile: `conflict with "clusterrole-aggregation-controller": .rules`.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: educates:session-manager:core
  labels:
    {{- include "session-manager.labels" . | nindent 4 }}
    rbac.educates.dev/extends-workshop-permissions: "true"
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: ["*"]
  - apiGroups: [""]
    resources: [limitranges, resourcequotas]
    verbs: ["*"]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles, clusterrolebindings]
    verbs: ["*"]
  - apiGroups: [training.educates.dev]
    resources:
      - workshops
      - workshopsessions
      - trainingportals
      - workshopenvironments
      - workshopallocations
      - workshoprequests
    verbs: ["*"]
  - apiGroups: [secrets.educates.dev]
    resources: [secretcopiers]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: educates:session:view
  labels:
    {{- include "session-manager.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - endpoints
      - persistentvolumeclaims
      - persistentvolumeclaims/status
      - pods
      - replicationcontrollers
      - replicationcontrollers/scale
      - serviceaccounts
      - services
      - services/status
