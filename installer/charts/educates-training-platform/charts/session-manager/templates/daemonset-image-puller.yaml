{{- if .Values.imagePrePuller.enabled }}
{{- /*
The pod runs nothing from the images it pulls. A first init container
copies the image-puller helper into a shared emptyDir volume, every
pulled image is an init container that runs the helper's exit role from
that volume, and the long-running container is the helper's wait role.
An image without a shell or /bin/true, such as a distroless or scratch
image, is then pulled like any other, and never stops the init
containers after it.
*/}}
{{- $helperImage := printf "%s:%s" (include "session-manager.imagePuller.image.repository" .) (include "session-manager.imagePuller.image.tag" .) }}
{{- $helperPullPolicy := include "session-manager.imagePuller.image.pullPolicy" . }}
{{- $helperDir := "/opt/image-puller" }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: image-puller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "session-manager.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: image-puller
  template:
    metadata:
      labels:
        {{- include "session-manager.labels" . | nindent 8 }}
        app.kubernetes.io/component: image-puller
        app: image-puller
    spec:
      serviceAccountName: image-puller
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      volumes:
        - name: image-puller
          emptyDir: {}
      initContainers:
        - name: copy-image-puller
          image: {{ $helperImage | quote }}
          imagePullPolicy: {{ $helperPullPolicy }}
          command: ["/image-puller", "copy", {{ $helperDir | quote }}]
          volumeMounts:
            - name: image-puller
              mountPath: {{ $helperDir }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
        {{- range $i, $image := include "session-manager.prePullImages" . | fromYamlArray }}
        - name: prepull-{{ $i }}
          image: {{ $image | quote }}
          imagePullPolicy: {{ include "session-manager.derivedPullPolicy" $image }}
          command: [{{ printf "%s/image-puller" $helperDir | quote }}, "exit"]
          volumeMounts:
            - name: image-puller
              mountPath: {{ $helperDir }}
        {{- end }}
      containers:
        - name: image-puller
          image: {{ $helperImage | quote }}
          imagePullPolicy: {{ $helperPullPolicy }}
          command: ["/image-puller", "wait"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
{{- end }}
