{{- /*
SecretCopier resources distribute Secrets across namespaces. The
secrets.educates.dev CRDs are owned by the secrets-manager subchart, which is
a hard dependency of session-manager (see decisions.md).

Four kinds of copy rules:

  1. Ingress TLS + CA from external source namespaces into the release
     namespace. Auto-derived from `clusterIngress.tlsCertificateRef.namespace`
     and `clusterIngress.caCertificateRef.namespace` — if either points at a
     namespace different from the release namespace, that Secret is copied in.
  2. Image-pull Secrets from external source namespaces into the release
     namespace (`secretPropagation.upstream.imagePullSecrets`).
  3. Image-pull Secrets in the release namespace pushed downstream into
     workshop-portal, workshop-environment and workshop-session namespaces
     (selected by label), from `secretPropagation.imagePullSecretNames`;
     with `secretPropagation.sessionNamespaces` false, only the session
     namespaces of a vcluster.
  4. Website-theme Secrets from external source namespaces into the release
     namespace, from `secretPropagation.upstream.websiteThemes` and from
     `websiteStyling.themeDataRefs` whose namespace is set and external.

Rules referencing a source namespace that equals the release namespace are
skipped (no copy needed).
*/ -}}
{{- $ns := .Release.Namespace -}}
{{- $ci := include "session-manager.resolvedClusterIngress" . | fromYaml -}}
{{- $tlsRef := default dict $ci.tlsCertificateRef -}}
{{- $caRef := default dict $ci.caCertificateRef -}}
{{- $tlsName := default "" $tlsRef.name -}}
{{- $tlsNs := default "" $tlsRef.namespace -}}
{{- $caName := default "" $caRef.name -}}
{{- $caNs := default "" $caRef.namespace -}}
{{- $tlsRule := and $tlsName $tlsNs (ne $tlsNs $ns) -}}
{{- $caRule := and $caName $caNs (ne $caNs $ns) -}}
{{- if or $tlsRule $caRule }}
apiVersion: secrets.educates.dev/v1beta1
kind: SecretCopier
metadata:
  name: educates-ingress-secrets
  labels:
    {{- include "session-manager.labels" . | nindent 4 }}
spec:
  rules:
    {{- if $tlsRule }}
    - sourceSecret:
        name: {{ $tlsName | quote }}
        namespace: {{ $tlsNs | quote }}
      targetNamespaces:
        nameSelector:
          matchNames:
            - {{ $ns | quote }}
    {{- end }}
    {{- if $caRule }}
    - sourceSecret:
        name: {{ $caName | quote }}
        namespace: {{ $caNs | quote }}
      targetNamespaces:
        nameSelector:
          matchNames:
            - {{ $ns | quote }}
    {{- end }}
{{- end }}
{{- $sp := default dict .Values.secretPropagation -}}
{{- $upstream := default dict $sp.upstream -}}
{{- $upstreamPullSecrets := list -}}
{{- range default list $upstream.imagePullSecrets -}}
  {{- if and .name .namespace (ne .namespace $ns) -}}
    {{- $upstreamPullSecrets = append $upstreamPullSecrets . -}}
  {{- end -}}
{{- end -}}
{{- if $upstreamPullSecrets }}
---
apiVersion: secrets.educates.dev/v1beta1
kind: SecretCopier
metadata:
  name: educates-upstream-image-pull-secrets
  labels:
    {{- include "session-manager.labels" . | nindent 4 }}
spec:
  rules:
    {{- range $upstreamPullSecrets }}
    - sourceSecret:
        name: {{ .name | quote }}
        namespace: {{ .namespace | quote }}
      targetNamespaces:
        nameSelector:
          matchNames:
            - {{ $ns | quote }}
    {{- end }}
{{- end }}
{{- /*
Workshop-session namespaces get the image-pull Secrets unless
secretPropagation.sessionNamespaces is false; the namespace of a session's
vcluster, which the session user cannot reach, gets them either way.
*/ -}}
{{- $sessionNamespaces := true -}}
{{- if hasKey $sp "sessionNamespaces" -}}
{{- $sessionNamespaces = $sp.sessionNamespaces -}}
{{- end -}}
{{- if default list $sp.imagePullSecretNames }}
---
apiVersion: secrets.educates.dev/v1beta1
kind: SecretCopier
metadata:
  name: educates-downstream-image-pull-secrets
  labels:
    {{- include "session-manager.labels" . | nindent 4 }}
spec:
  rules:
    {{- range $sp.imagePullSecretNames }}
    - sourceSecret:
        name: {{ . | quote }}
        namespace: {{ $ns | quote }}
      targetNamespaces:
        labelSelector:
          matchLabels:
            training.educates.dev/component: portal
    - sourceSecret:
        name: {{ . | quote }}
        namespace: {{ $ns | quote }}
      targetNamespaces:
        labelSelector:
          matchLabels:
            training.educates.dev/component: environment
    - sourceSecret:
        name: {{ . | quote }}
        namespace: {{ $ns | quote }}
      targetNamespaces:
        labelSelector:
          matchLabels:
            training.educates.dev/component: session
            {{- if not $sessionNamespaces }}
            training.educates.dev/application: vcluster
            {{- end }}
    {{- end }}
{{- end }}
{{- $upstreamThemes := list -}}
{{- range default list $upstream.websiteThemes -}}
  {{- if and .name .namespace (ne .namespace $ns) -}}
    {{- $upstreamThemes = append $upstreamThemes . -}}
  {{- end -}}
{{- end -}}
{{- $wstyle := default dict .Values.websiteStyling -}}
{{- range default list $wstyle.themeDataRefs -}}
  {{- if and .name .namespace (ne .namespace $ns) -}}
    {{- $upstreamThemes = append $upstreamThemes . -}}
  {{- end -}}
{{- end -}}
{{- if $upstreamThemes }}
---
apiVersion: secrets.educates.dev/v1beta1
kind: SecretCopier
metadata:
  name: educates-upstream-website-themes
  labels:
    {{- include "session-manager.labels" . | nindent 4 }}
spec:
  rules:
    {{- range $upstreamThemes }}
    - sourceSecret:
        name: {{ .name | quote }}
        namespace: {{ .namespace | quote }}
      targetNamespaces:
        nameSelector:
          matchNames:
            - {{ $ns | quote }}
    {{- end }}
{{- end }}
