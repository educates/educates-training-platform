{{- $sp := default dict .Values.secretPropagation -}}
{{- $sessionNamespaces := true -}}
{{- if hasKey $sp "sessionNamespaces" -}}
{{- $sessionNamespaces = $sp.sessionNamespaces -}}
{{- end -}}
{{- if .Values.secretPropagation.imagePullSecretNames }}
apiVersion: secrets.educates.dev/v1beta1
kind: SecretInjector
metadata:
  name: educates-image-pull-secrets
  labels:
    {{- include "session-manager.labels" . | nindent 4 }}
spec:
  rules:
    - targetNamespaces:
        labelSelector:
          matchLabels:
            training.educates.dev/component: portal
      sourceSecrets:
        nameSelector:
          matchNames:
            {{- range .Values.secretPropagation.imagePullSecretNames }}
            - {{ . | quote }}
            {{- end }}
      serviceAccounts:
        labelSelector:
          matchLabels:
            training.educates.dev/component: portal
    - targetNamespaces:
        labelSelector:
          matchLabels:
            training.educates.dev/component: environment
      sourceSecrets:
        nameSelector:
          matchNames:
            {{- range .Values.secretPropagation.imagePullSecretNames }}
            - {{ . | quote }}
            {{- end }}
      serviceAccounts:
        labelSelector:
          matchLabels:
            training.educates.dev/component: environment
    - targetNamespaces:
        labelSelector:
          matchLabels:
            training.educates.dev/component: environment
      sourceSecrets:
        nameSelector:
          matchNames:
            {{- range .Values.secretPropagation.imagePullSecretNames }}
            - {{ . | quote }}
            {{- end }}
      serviceAccounts:
        labelSelector:
          matchLabels:
            training.educates.dev/component: session
    # Workshop session namespaces, the vcluster namespace of a session
    # included, or with secretPropagation.sessionNamespaces false only the
    # vcluster namespaces. No serviceAccounts selector, so every
    # ServiceAccount there gets the Secrets: the default one, and those a
    # workshop's session objects create, such as vcluster's.
    - targetNamespaces:
        labelSelector:
          matchLabels:
            training.educates.dev/component: session
            {{- if not $sessionNamespaces }}
            training.educates.dev/application: vcluster
            {{- end }}
      sourceSecrets:
        nameSelector:
          matchNames:
            {{- range .Values.secretPropagation.imagePullSecretNames }}
            - {{ . | quote }}
            {{- end }}
{{- end }}
---
# `educates-registry-credentials` is a fixed Secret name that the runtime
# materialises per workshop session for in-session image-build use. The
# injector wires it into the default ServiceAccount of every session
# namespace. Always rendered — does nothing until the Secret exists.
apiVersion: secrets.educates.dev/v1beta1
kind: SecretInjector
metadata:
  name: educates-registry-credentials
  labels:
    {{- include "session-manager.labels" . | nindent 4 }}
spec:
  rules:
    - targetNamespaces:
        labelSelector:
          matchLabels:
            training.educates.dev/component: session
      sourceSecrets:
        nameSelector:
          matchNames:
            - educates-registry-credentials
      serviceAccounts:
        nameSelector:
          matchNames:
            - default
