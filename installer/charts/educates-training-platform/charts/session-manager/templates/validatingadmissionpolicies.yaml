{{- /*
Confines each training portal to its own workshop environments, sessions
and allocations.

These resources are cluster scoped, so RBAC can grant a portal write access
to every portal's resources or to none, and session-manager acts on what a
portal creates with its own, far wider, rights. The policy matches only
training portal service accounts, `system:serviceaccount:<portal>-ui:training-portal`,
takes the portal's name from the account's namespace, and admits a create,
update or delete of these resources only when:

  - the `training.educates.dev/portal.name` label names the portal on the
    object and, for an update or delete, on the existing object;
  - a workshop environment is named `<portal>-w<digits>`, and a session or
    allocation names such an environment in `spec.environment.name`;
  - a session's own name, and an allocation's `spec.session.name`, start
    with its environment's name and a hyphen;
  - a workshop environment lists nothing in `spec.environment.objects` or
    `spec.environment.secrets`.

A native admission policy confines portals on every install, whether or not
Kyverno is enabled. Every other identity, session-manager's included, is left
alone.
*/ -}}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: educates-training-portal-scope
  labels:
    {{- include "session-manager.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [training.educates.dev]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [workshopenvironments, workshopsessions, workshopallocations]
  matchConditions:
    - name: training-portal-service-account
      expression: >-
        request.userInfo.username.matches('^system:serviceaccount:[^:]+-ui:training-portal$')
  variables:
    - name: portalNamespace
      expression: request.userInfo.username.split(':')[2]
    - name: portal
      expression: >-
        variables.portalNamespace.substring(0, size(variables.portalNamespace) - size('-ui'))
    # The workshop environment a request is about: the environment itself,
    # or the one a session or allocation names.
    - name: environmentName
      expression: >-
        request.kind.kind == 'WorkshopEnvironment' ? object.metadata.name
        : has(object.spec) && has(object.spec.environment) && has(object.spec.environment.name)
          ? object.spec.environment.name : ''
    - name: environmentPrefix
      expression: variables.portal + '-w'
    - name: isPortalEnvironmentName
      expression: >-
        variables.environmentName.startsWith(variables.environmentPrefix)
        && variables.environmentName.substring(size(variables.environmentPrefix)).matches('^[0-9]+$')
  validations:
    # The object written carries the portal's label.
    - expression: >-
        object == null
        || (has(object.metadata.labels)
            && 'training.educates.dev/portal.name' in object.metadata.labels
            && object.metadata.labels['training.educates.dev/portal.name'] == variables.portal)
      messageExpression: >-
        'training portal ' + variables.portal
        + ' may only write resources labelled training.educates.dev/portal.name='
        + variables.portal
      reason: Forbidden
    # The object changed or deleted already carried it.
    - expression: >-
        oldObject == null
        || (has(oldObject.metadata.labels)
            && 'training.educates.dev/portal.name' in oldObject.metadata.labels
            && oldObject.metadata.labels['training.educates.dev/portal.name'] == variables.portal)
      messageExpression: >-
        'training portal ' + variables.portal
        + ' may only change or delete resources already labelled training.educates.dev/portal.name='
        + variables.portal
      reason: Forbidden
    - expression: object == null || variables.isPortalEnvironmentName
      messageExpression: >-
        'training portal ' + variables.portal
        + (request.kind.kind == 'WorkshopEnvironment'
            ? ' may only name workshop environments '
            : ' may only refer to workshop environments named ')
        + variables.environmentPrefix + '<digits>'
      reason: Forbidden
    - expression: >-
        object == null || request.kind.kind != 'WorkshopSession'
        || object.metadata.name.startsWith(variables.environmentName + '-')
      messageExpression: >-
        'training portal ' + variables.portal
        + ' may only name sessions starting with ' + variables.environmentName + '-'
      reason: Forbidden
    - expression: >-
        object == null || request.kind.kind != 'WorkshopAllocation'
        || (has(object.spec) && has(object.spec.session) && has(object.spec.session.name)
            && object.spec.session.name.startsWith(variables.environmentName + '-'))
      messageExpression: >-
        'training portal ' + variables.portal
        + ' may only allocate sessions whose names start with ' + variables.environmentName + '-'
      reason: Forbidden
    - expression: >-
        object == null || request.kind.kind != 'WorkshopEnvironment'
        || !has(object.spec) || !has(object.spec.environment)
        || !has(object.spec.environment.objects) || size(object.spec.environment.objects) == 0
      messageExpression: >-
        'training portal ' + variables.portal
        + ' may not list objects in a workshop environment\'s spec.environment.objects'
      reason: Forbidden
    - expression: >-
        object == null || request.kind.kind != 'WorkshopEnvironment'
        || !has(object.spec) || !has(object.spec.environment)
        || !has(object.spec.environment.secrets) || size(object.spec.environment.secrets) == 0
      messageExpression: >-
        'training portal ' + variables.portal
        + ' may not list Secrets in a workshop environment\'s spec.environment.secrets'
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: educates-training-portal-scope
  labels:
    {{- include "session-manager.labels" . | nindent 4 }}
spec:
  policyName: educates-training-portal-scope
  validationActions: [Deny]
{{- /*
Warns whoever creates or updates a TrainingPortal that sets its credentials
inline, in `spec.portal.credentials` or `spec.portal.clients`. Both are
deprecated, still honoured, and will be removed in a future release, in favour
of referencing Secrets that hold the credentials with
`spec.portal.credentialSecrets.admin` and `spec.portal.credentialSecrets.robot`.
session-manager treats an empty inline value as unset, so only a value that is
not empty draws the warning. The binding only warns, for every user, and an
error evaluating the policy is ignored, so it never stands in the way of a
request.
*/}}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: educates-training-portal-inline-credentials
  labels:
    {{- include "session-manager.labels" . | nindent 4 }}
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [training.educates.dev]
        apiVersions: [v1beta1]
        operations: [CREATE, UPDATE]
        resources: [trainingportals]
  variables:
    - name: adminCredentialsInline
      expression: >-
        has(object.spec) && has(object.spec.portal)
        && has(object.spec.portal.credentials) && has(object.spec.portal.credentials.admin)
        && ((has(object.spec.portal.credentials.admin.username)
             && size(object.spec.portal.credentials.admin.username) != 0)
            || (has(object.spec.portal.credentials.admin.password)
                && size(object.spec.portal.credentials.admin.password) != 0))
    - name: robotCredentialsInline
      expression: >-
        has(object.spec) && has(object.spec.portal)
        && has(object.spec.portal.credentials) && has(object.spec.portal.credentials.robot)
        && ((has(object.spec.portal.credentials.robot.username)
             && size(object.spec.portal.credentials.robot.username) != 0)
            || (has(object.spec.portal.credentials.robot.password)
                && size(object.spec.portal.credentials.robot.password) != 0))
    - name: robotClientInline
      expression: >-
        has(object.spec) && has(object.spec.portal)
        && has(object.spec.portal.clients) && has(object.spec.portal.clients.robot)
        && ((has(object.spec.portal.clients.robot.id)
             && size(object.spec.portal.clients.robot.id) != 0)
            || (has(object.spec.portal.clients.robot.secret)
                && size(object.spec.portal.clients.robot.secret) != 0))
  validations:
    - expression: >-
        !variables.adminCredentialsInline && !variables.robotCredentialsInline
        && !variables.robotClientInline
      message: >-
        spec.portal.credentials and spec.portal.clients are deprecated and will
        be removed in a future release: reference Secrets holding the
        credentials with spec.portal.credentialSecrets.admin and
        spec.portal.credentialSecrets.robot instead
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: educates-training-portal-inline-credentials
  labels:
    {{- include "session-manager.labels" . | nindent 4 }}
spec:
  policyName: educates-training-portal-inline-credentials
  validationActions: [Warn]
