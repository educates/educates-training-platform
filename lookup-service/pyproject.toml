[project]
name = "lookup-service"
version = "0.1.0"
description = "Cluster and workshop lookup service for the Educates training platform."
requires-python = ">=3.14"
dependencies = [
    "kopf[full-auth]>=1.44.6",
    "pykube-ng>=23.6.0",
    "PyYAML>=6.0.3",
    "aiohttp>=3.14.3",
    "wrapt>=2.2.1",
    "PyJWT>=2.13.0",
]

[tool.uv]
# This is an application run from source, not an installable package; uv sync
# should only install the dependencies.
package = false
