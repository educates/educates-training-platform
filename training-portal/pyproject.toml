[project]
name = "training-portal"
version = "0.1.0"
description = "Training portal for the Educates training platform."
requires-python = ">=3.14,<3.15"
dependencies = [
    "mod_wsgi==6.0.4",
    "Django==5.2.16",
    "django-registration==5.2.1",
    "django-crispy-forms==2.5",
    "crispy-bootstrap5==2025.6",
    "wrapt>=2.2.1",
    "django-oauth-toolkit==3.3.0",
    "django-cors-headers==4.9.0",
    "requests>=2.33.0",
    "django-csp==4.0",
    "kopf[full-auth]>=1.44.6",
    "pykube-ng>=23.6.0",
    "rstr>=3.2.2",
    # Not imported directly; constrained here to control CVE exposure via kopf.
    "aiohttp>=3.14.3",
    # Not imported directly; constrained here to control CVE exposure via
    # jwcrypto (django-oauth-toolkit).
    "cryptography>=50.0.0",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
]

[tool.uv]
# This is an application run from source, not an installable package; uv sync
# should only install the dependencies.
package = false
